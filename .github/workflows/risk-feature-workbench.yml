name: risk-feature-workbench

on:
  push:
    paths: ['risk-feature-workbench/**', '.github/workflows/risk-feature-workbench.yml']
  pull_request:
    paths: ['risk-feature-workbench/**', '.github/workflows/risk-feature-workbench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows PowerShell 5.1 / Python 3.9.7
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: risk-feature-workbench
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.7'
          architecture: x64
      - name: Install locked dependencies
        run: .\scripts\setup.ps1 -Real -Python "$env:pythonLocation\python.exe"
      - name: Test synthetic and mocked integrations
        run: .\scripts\test.ps1
      - name: Check web entry point
        run: .\.venv\Scripts\python.exe -m riskmatch serve --help
