apiVersion: apps/v1
kind: Deployment
metadata:
  name: verikopru
  labels:
    app: verikopru
  annotations:
    # Yeni build bitince (verikopru:latest değişince) imaj alanı güncellenir ve pod yeniden başlar.
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"verikopru:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  # TEK pod: süreç içi oturum + SQLite + süreç içi hedef kilidi. Ölçeklendirmeyin.
  replicas: 1
  # RWO PVC + SQLite: eski ve yeni pod aynı anda çalışmamalı.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verikopru
  template:
    metadata:
      labels:
        app: verikopru
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # build.yaml'daki ImageStream'den çözülür (lookupPolicy.local); registry/namespace yazılmaz.
          image: verikopru:latest
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: verikopru-config
            # Ortama özgü, zorunlu (TT_TARGET_DENY_ALIASES); yoksa pod başlamaz.
            - configMapRef:
                name: verikopru-site
          env:
            - name: TT_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: verikopru-secrets
                  key: TT_SESSION_SECRET
            - name: TT_ANON_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: verikopru-secrets
                  key: TT_ANON_HMAC_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          # 5M satırlık Arrow tamponu bellekte tutulur; limitleri iş yüküne göre ayarlayın.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tns
              mountPath: /etc/tt/tns
              readOnly: true
            - name: secrets
              mountPath: /etc/tt/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: verikopru-data
        - name: tns
          configMap:
            name: verikopru-tns
            items:
              - key: tnsnames.ora
                path: tnsnames.ora
        - name: secrets
          secret:
            secretName: verikopru-secrets
            defaultMode: 0440
            # service_accounts.toml isteğe bağlı: yoksa pod açılır, 7 gün kontrolü "doğrulanamadı" kalır.
            # Secret'ın kendisi yine zorunlu (TT_SESSION_SECRET / TT_ANON_HMAC_KEY yukarıda).
            optional: true
            items:
              - key: service_accounts.toml
                path: service_accounts.toml
