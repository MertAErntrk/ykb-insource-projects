apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: verikopru
  labels:
    app: verikopru
  annotations:
    # SSE ve uzun sayım sorguları için zaman aşımı.
    haproxy.router.openshift.io/timeout: 10m
spec:
  # host bilerek yok: OpenShift https://verikopru-<namespace>.<apps alan adı> adresini verir
  # (oc get route verikopru). Özel ad gerekiyorsa buraya host: ekleyin.
  to:
    kind: Service
    name: verikopru
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
