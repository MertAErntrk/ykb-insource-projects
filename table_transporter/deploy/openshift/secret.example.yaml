# ÖRNEK - uygulanmaz (kustomization'a dahil değil). Gerçek değerleri Git'e koymayın.
# Gerçek Secret'ı komutla yaratın:
#   oc create secret generic verikopru-secrets \
#     --from-literal=TT_SESSION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=TT_ANON_HMAC_KEY="$(openssl rand -base64 48)" \
#     --from-file=service_accounts.toml=config/service_accounts.toml
# İki anahtar en az 32 bayt ve birbirinden farklı olmalı.
# tnsnames.ora Secret değil ConfigMap'tir:
#   oc create configmap verikopru-tns --from-file=tnsnames.ora=config/tnsnames.ora
apiVersion: v1
kind: Secret
metadata:
  name: verikopru-secrets
  labels:
    app: verikopru
type: Opaque
stringData:
  TT_SESSION_SECRET: "CHANGE_ME"
  TT_ANON_HMAC_KEY: "CHANGE_ME"
  service_accounts.toml: "CHANGE_ME"
