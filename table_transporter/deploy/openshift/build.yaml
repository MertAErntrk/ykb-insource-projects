# İmaj kümede build edilir (binary build); yerel Docker/Podman gerekmez.
# Kustomization'a dahil değil: önce bu dosya uygulanır, sonra build başlatılır (docs/DEPLOY.md):
#   oc apply -f deploy/openshift/build.yaml
#   git archive --format=tar.gz -o <arşiv> HEAD      (table_transporter klasöründen)
#   oc start-build verikopru --from-archive=<arşiv> --follow
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: verikopru
  labels:
    app: verikopru
spec:
  # deployment.yaml imajı yalnız adla (verikopru:latest) verir; namespace içindeki bu ImageStream'den çözülür.
  # İç registry kapalı kümede tag, sdlc'deki imajı izler (oc tag ... --scheduled, docs/DEPLOY.md).
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: verikopru
  labels:
    app: verikopru
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      # Kurum taban imajlı Dockerfile; taban imaj bu secret ile çekilir.
      dockerfilePath: Dockerfile
      pullSecret:
        name: registrypullsecret
  # Uygulama imajının kendi yeri (kurum düzeni: internal-docker-app/com/ykb/<birim>/<proje>/<uygulama>).
  # Push yolu ASLA taban imajın adresi olmaz (ortak taban imajın üzerine yazar).
  output:
    to:
      kind: DockerImage
      name: sdlc.yapikredi.com.tr/internal-docker-app/com/ykb/datawarehouse/riskdwh/verikopru:latest
    pushSecret:
      name: registrypullsecret
  # Bellek ve disk (kota limits.ephemeral-storage istiyor); yetmezse düşürün.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
      ephemeral-storage: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 10Gi
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
