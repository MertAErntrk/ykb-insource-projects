[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-feature-workbench"
version = "0.3.2"
description = "Yerel, kanıta dayalı Oracle risk feature incelemesi"
requires-python = ">=3.9"
dependencies = ["openpyxl==3.1.5", "et-xmlfile==2.0.0", "oracledb==4.0.2", "Flask==3.1.3", "waitress==3.0.2"]

[project.scripts]
riskmatch = "riskmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskmatch = ["data/*.json", "data/*.xlsx", "templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
